[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/crypto",
    "crates/storage",
    "crates/manifest",
    "crates/vault",
    "crates/sync",
    "crates/network",
    "crates/identity",
    "crates/daemon",
    "crates/ipc",
    "crates/ffi",
    "crates/cli",
    "crates/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

